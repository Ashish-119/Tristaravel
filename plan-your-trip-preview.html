<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Plan Your Trip — Preview</title>
  <!-- Standalone visual preview of src/app/plan-your-trip/page.jsx. Open in a
       browser. Carousels are swipable/clickable; interacting reveals "Get Quote". -->
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body { font-family: ui-sans-serif, system-ui, sans-serif; }
    .reveal { display: grid; grid-template-rows: 0fr; opacity: 0; transition: all .3s ease; }
    .reveal.open { grid-template-rows: 1fr; opacity: 1; }
    .reveal > div { overflow: hidden; }
    .slide { transition: opacity .5s ease; }
  </style>
</head>
<body class="bg-[#F8FAFC] text-slate-900">

  <!-- ── Navbar (for context) ─────────────────────────────────────────── -->
  <nav class="sticky top-0 z-50 bg-white/80 backdrop-blur-md border-b border-slate-200">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
      <div class="flex justify-between items-center h-20">
        <div class="flex items-center gap-2">
          <div class="bg-[#1E293B] p-2 rounded-lg">
            <svg class="text-[#FBBF24] w-6 h-6" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M19 17h2l.64-2.54c.24-.959.24-1.962 0-2.92l-1.07-4.27A3 3 0 0 0 17.66 5H4a2 2 0 0 0-2 2v10h2"/><circle cx="7" cy="17" r="2"/><path d="M9 17h6"/><circle cx="17" cy="17" r="2"/></svg>
          </div>
          <span class="text-2xl font-bold tracking-tight text-[#1E293B]">Tristar<span class="text-[#FBBF24]">avel.com</span></span>
        </div>
        <div class="hidden md:flex items-center space-x-8 text-sm font-medium text-slate-600">
          <span>Home</span><span>About Us</span><span>Services</span>
          <span class="text-[#1E293B] font-bold border-b-2 border-[#FBBF24] pb-1">Plan Your Trip</span>
          <span>Contact</span>
          <span class="bg-[#1E293B] text-white px-5 py-2.5 rounded-full text-sm font-semibold">Book Now</span>
        </div>
      </div>
    </div>
  </nav>

  <!-- ── Header ───────────────────────────────────────────────────────── -->
  <section class="bg-[#1E293B] py-24 text-center relative overflow-hidden">
    <div class="absolute inset-0 opacity-20 pointer-events-none">
      <div class="absolute inset-0" style="background:radial-gradient(circle at 60% 40%, #334155 0%, transparent 60%)"></div>
    </div>
    <div class="relative z-10 max-w-7xl mx-auto px-4">
      <span class="inline-flex items-center gap-2 text-xs font-bold uppercase tracking-widest text-[#FBBF24] bg-[#FBBF24]/10 px-4 py-2 rounded-full mb-6">✦ Curated Destinations · India</span>
      <h1 class="text-4xl md:text-5xl font-bold text-white mb-6">Plan Your Trip</h1>
      <p class="text-slate-400 max-w-2xl mx-auto text-lg">Explore India's most loved destinations — swipe through nearby gems and unmissable experiences, then get an instant quote for your journey.</p>
    </div>
  </section>

  <!-- ── Destinations grid ────────────────────────────────────────────── -->
  <section class="py-20">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
      <div id="grid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-8"></div>
    </div>
  </section>

  <script>
    const DESTINATIONS = [
      { id:"agra", name:"Agra", state:"Uttar Pradesh", tagline:"Where the Taj Mahal rises at dawn", nearby:["Fatehpur Sikri","Mathura","Vrindavan","Bharatpur"], thingsToDo:["Watch sunrise at the Taj Mahal","Explore the red-sandstone Agra Fort","Shop for marble inlay handicrafts"] },
      { id:"jaipur", name:"Jaipur", state:"Rajasthan", tagline:"The majestic Pink City", nearby:["Amber Fort","Ajmer","Pushkar"], thingsToDo:["Photograph the Hawa Mahal facade","Climb Nahargarh Fort for city views","Bargain in the Johari Bazaar"] },
      { id:"udaipur", name:"Udaipur", state:"Rajasthan", tagline:"The romantic City of Lakes", nearby:["Kumbhalgarh","Mount Abu","Chittorgarh"], thingsToDo:["Boat ride across Lake Pichola","Tour the grand City Palace","Catch sunset at Sajjangarh"] },
      { id:"jaisalmer", name:"Jaisalmer", state:"Rajasthan", tagline:"The Golden City of the Thar", nearby:["Sam Sand Dunes","Kuldhara","Longewala"], thingsToDo:["Camel safari across the dunes","Sleep under stars in a desert camp","Wander the living Sonar Qila"] },
      { id:"jodhpur", name:"Jodhpur", state:"Rajasthan", tagline:"The Blue City under the fort", nearby:["Mandore","Osian","Bishnoi Villages"], thingsToDo:["Explore the towering Mehrangarh Fort","Lose yourself in the blue lanes","Visit the marble Jaswant Thada"] },
      { id:"varanasi", name:"Varanasi", state:"Uttar Pradesh", tagline:"The spiritual heart of India", nearby:["Sarnath","Bodh Gaya","Prayagraj"], thingsToDo:["Witness the Ganga aarti at dusk","Sunrise boat ride along the ghats","Walk the timeless old-city lanes"] },
      { id:"rishikesh", name:"Rishikesh", state:"Uttarakhand", tagline:"Yoga capital on the Ganga", nearby:["Haridwar","Devprayag","Neelkanth"], thingsToDo:["White-water raft the Ganga","Cross the swaying Laxman Jhula","Evening aarti at Triveni Ghat"] },
      { id:"manali", name:"Manali", state:"Himachal Pradesh", tagline:"Gateway to the high Himalayas", nearby:["Solang Valley","Rohtang Pass","Kasol"], thingsToDo:["Paraglide over Solang Valley","Play in the snow at Rohtang","Cafe-hop through Old Manali"] },
      { id:"shimla", name:"Shimla", state:"Himachal Pradesh", tagline:"The colonial Queen of the Hills", nearby:["Kufri","Chail","Naldehra"], thingsToDo:["Stroll along the historic Mall Road","Ride the UNESCO toy train","Hike up to Jakhoo Temple"] },
      { id:"leh", name:"Leh", state:"Ladakh", tagline:"Land of high passes & blue lakes", nearby:["Pangong Lake","Nubra Valley","Khardung La"], thingsToDo:["Drive to the surreal Pangong Lake","Visit cliff-top monasteries","Camel ride on Nubra's dunes"] },
      { id:"srinagar", name:"Srinagar", state:"Jammu & Kashmir", tagline:"Paradise on earth", nearby:["Gulmarg","Pahalgam","Sonamarg"], thingsToDo:["Shikara ride on Dal Lake","Stay aboard a heritage houseboat","Wander the Mughal gardens"] },
      { id:"goa", name:"Goa", state:"Goa", tagline:"Sun, sand and serenity", nearby:["Old Goa","Dudhsagar Falls","Anjuna"], thingsToDo:["Unwind on Baga & Palolem beaches","Try parasailing & jet-skiing","Tour the Portuguese-era churches"] },
      { id:"munnar", name:"Munnar", state:"Kerala", tagline:"Rolling tea-garden hills", nearby:["Thekkady","Eravikulam","Top Station"], thingsToDo:["Walk through emerald tea plantations","Spot the Nilgiri tahr","Tour a fragrant spice garden"] },
      { id:"alleppey", name:"Alleppey", state:"Kerala", tagline:"The Venice of the East", nearby:["Kumarakom","Kuttanad","Marari Beach"], thingsToDo:["Cruise the backwaters on a houseboat","Stroll a waterside village","Feast on a banana-leaf sadhya"] },
      { id:"ooty", name:"Ooty", state:"Tamil Nadu", tagline:"Queen of the Nilgiris", nearby:["Coonoor","Doddabetta","Pykara"], thingsToDo:["Ride the Nilgiri toy train","Row a boat on Ooty Lake","Roam the Botanical Gardens"] },
      { id:"hampi", name:"Hampi", state:"Karnataka", tagline:"Ruins of a forgotten empire", nearby:["Anegundi","Tungabhadra Dam","Badami"], thingsToDo:["Explore the Vijayanagara ruins","Catch sunset from Matanga Hill","Float the river in a coracle"] },
      { id:"coorg", name:"Coorg", state:"Karnataka", tagline:"The Scotland of India", nearby:["Madikeri","Dubare","Abbey Falls"], thingsToDo:["Tour a working coffee estate","Meet elephants at Dubare camp","Trek up to Tadiandamol peak"] },
      { id:"mysore", name:"Mysore", state:"Karnataka", tagline:"The royal City of Palaces", nearby:["Srirangapatna","Chamundi Hills","Brindavan Gardens"], thingsToDo:["Tour the illuminated Mysore Palace","Climb to Chamundeshwari Temple","Watch the Brindavan light show"] },
      { id:"mahabaleshwar", name:"Mahabaleshwar", state:"Maharashtra", tagline:"The strawberry hill station", nearby:["Panchgani","Pratapgad","Wai"], thingsToDo:["Pick fresh strawberries from a farm","Boat across Venna Lake","Sunset from Arthur's Seat"] },
      { id:"darjeeling", name:"Darjeeling", state:"West Bengal", tagline:"Land of the thunderbolt", nearby:["Kalimpong","Mirik","Ghum"], thingsToDo:["Sunrise over Kanchenjunga at Tiger Hill","Ride the Himalayan toy train","Sip chai amid the tea gardens"] },
      { id:"gangtok", name:"Gangtok", state:"Sikkim", tagline:"The cloud-kissed capital", nearby:["Tsomgo Lake","Nathula Pass","Rumtek"], thingsToDo:["Glide over town on the ropeway","Visit the glacial Tsomgo Lake","Evening walk down MG Marg"] },
      { id:"amritsar", name:"Amritsar", state:"Punjab", tagline:"Home of the Golden Temple", nearby:["Wagah Border","Jallianwala Bagh","Tarn Taran"], thingsToDo:["Seek darshan at the Golden Temple","Cheer the Wagah border ceremony","Share a meal at the langar"] },
      { id:"khajuraho", name:"Khajuraho", state:"Madhya Pradesh", tagline:"Temples of timeless artistry", nearby:["Panna National Park","Raneh Falls","Orchha"], thingsToDo:["Admire the Western Group of Temples","Watch the sound & light show","Safari through Panna's forests"] },
      { id:"pondicherry", name:"Pondicherry", state:"Puducherry", tagline:"A slice of France in India", nearby:["Auroville","Mahabalipuram","Chunnambar"], thingsToDo:["Wander the colourful French Quarter","Sunrise on Promenade Beach","Find calm at Auroville's Matrimandir"] },
      { id:"andaman", name:"Andaman Islands", state:"Andaman & Nicobar", tagline:"Emerald isles of the Bay", nearby:["Havelock Island","Neil Island","Ross Island"], thingsToDo:["Scuba dive off Havelock","Sunset at Radhanagar Beach","Cellular Jail light & sound show"] },
    ];

    function slideImage(words, seed) {
      const tags = words.toLowerCase().replace(/&/g," ").replace(/[^a-z0-9\s]/g," ").trim().split(/\s+/).slice(0,4).join(",");
      return `https://loremflickr.com/800/520/${tags}/all?lock=${seed}`;
    }
    function buildSlides(place, baseSeed) {
      const nearby = place.nearby.map(t => ({ kind:"Nearby", title:t, words:`${t} india` }));
      const todo = place.thingsToDo.map(t => ({ kind:"To Do", title:t, words:`${place.name} india travel` }));
      return [...nearby, ...todo].map((s,i) => ({ ...s, img: slideImage(s.words, baseSeed+i) }));
    }

    const grid = document.getElementById("grid");
    DESTINATIONS.forEach((place, idx) => {
      const slides = buildSlides(place, (idx+1)*50);
      let index = 0, interacted = false;
      let touchX = null;

      const card = document.createElement("div");
      card.className = "bg-white rounded-[28px] overflow-hidden border border-slate-100 shadow-sm hover:shadow-2xl hover:shadow-slate-200 transition-all duration-500 flex flex-col";
      card.innerHTML = `
        <div class="carousel relative h-64 select-none cursor-pointer bg-slate-100">
          ${slides.map((s,i)=>`<img src="${s.img}" alt="${s.title}" draggable="false" class="slide absolute inset-0 w-full h-full object-cover ${i===0?'opacity-100':'opacity-0 pointer-events-none'}">`).join("")}
          <div class="absolute inset-0 pointer-events-none" style="background:linear-gradient(to top, rgba(0,0,0,.7), rgba(0,0,0,.1) 50%, transparent)"></div>
          <div class="absolute top-4 left-4 bg-white/90 backdrop-blur px-3 py-1.5 rounded-full shadow-sm"><span class="text-[11px] font-bold text-[#1E293B] uppercase tracking-widest">${place.name}</span></div>
          <div class="caption absolute bottom-4 left-4 right-4 pointer-events-none"></div>
          <button class="prev absolute left-2 top-1/2 -translate-y-1/2 w-8 h-8 rounded-full bg-white/85 hover:bg-white text-[#1E293B] flex items-center justify-center shadow">‹</button>
          <button class="next absolute right-2 top-1/2 -translate-y-1/2 w-8 h-8 rounded-full bg-white/85 hover:bg-white text-[#1E293B] flex items-center justify-center shadow">›</button>
          <div class="dots absolute top-4 right-4 flex gap-1"></div>
        </div>
        <div class="p-6 flex flex-col flex-1">
          <div class="flex items-center gap-2 text-xs font-bold text-slate-400 uppercase tracking-widest mb-1">📍 ${place.state}</div>
          <h3 class="text-xl font-bold text-[#1E293B]">${place.name}</h3>
          <p class="text-sm text-slate-500 mt-1 mb-4">${place.tagline}</p>
          <p class="text-[11px] text-slate-400 mb-4">Swipe or tap the gallery to explore ${slides.length} spots & experiences.</p>
          <div class="reveal mt-auto">
            <div><a href="#" class="block w-full bg-[#c1121f] hover:bg-[#a50f1a] text-white py-3.5 rounded-2xl font-bold text-sm flex items-center justify-center gap-2 shadow-lg shadow-red-900/20">Get Quote for ${place.name} →</a></div>
          </div>
        </div>`;
      grid.appendChild(card);

      const imgs = card.querySelectorAll(".slide");
      const caption = card.querySelector(".caption");
      const dotsWrap = card.querySelector(".dots");
      const reveal = card.querySelector(".reveal");
      slides.forEach((_,i)=>{ const d=document.createElement("span"); d.className="dot block h-1.5 rounded-full transition-all"; dotsWrap.appendChild(d); });
      const dots = card.querySelectorAll(".dot");

      function render() {
        imgs.forEach((im,i)=> im.className = `slide absolute inset-0 w-full h-full object-cover ${i===index?'opacity-100':'opacity-0 pointer-events-none'}`);
        dots.forEach((d,i)=> d.className = `dot block h-1.5 rounded-full transition-all ${i===index?'w-4 bg-white':'w-1.5 bg-white/50'}`);
        const s = slides[index];
        const isNear = s.kind === "Nearby";
        caption.innerHTML = `<span class="inline-flex items-center gap-1 text-[10px] font-bold uppercase tracking-wider px-2 py-0.5 rounded mb-1.5 ${isNear?'bg-[#FBBF24] text-[#1E293B]':'bg-[#c1121f] text-white'}">${isNear?'◎ Nearby':'⚑ Things to do'}</span><p class="text-white font-bold text-base leading-tight">${s.title}</p>`;
      }
      function mark(){ if(!interacted){ interacted=true; reveal.classList.add("open"); } }
      function go(dir){ mark(); index=(index+dir+slides.length)%slides.length; render(); }

      const carousel = card.querySelector(".carousel");
      carousel.addEventListener("click", mark);
      card.querySelector(".prev").addEventListener("click", e=>{e.stopPropagation();go(-1);});
      card.querySelector(".next").addEventListener("click", e=>{e.stopPropagation();go(1);});
      carousel.addEventListener("touchstart", e=> touchX=e.touches[0].clientX);
      carousel.addEventListener("touchend", e=>{ if(touchX===null) return; const dx=e.changedTouches[0].clientX-touchX; if(Math.abs(dx)>40) go(dx<0?1:-1); else mark(); touchX=null; });
      render();
    });
  </script>
</body>
</html>
